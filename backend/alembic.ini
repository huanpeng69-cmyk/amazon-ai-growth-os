# ============================================================
# Amazon AI Growth OS - Alembic configuration
#
# Migrations are now the single source of truth for schema evolution.
# - Local / Docker default: SQLite (DATABASE_URL unset or sqlite://...)
# - Production: PostgreSQL (DATABASE_URL=postgresql://..., injected by
#   docker-compose or the environment)
#
# env.py prefers the DATABASE_URL env var over the sqlalchemy.url below,
# so production can switch backends without editing this file.
# NOTE: keep this file ASCII-only; Alembic reads it with the platform
# locale codec (GBK on Windows), which cannot decode UTF-8 comments.
# ============================================================

[alembic]
# migrations directory, relative to this file
script_location = migrations
# add backend/ to sys.path so env.py can `from app...` import the models
prepend_sys_path = .

# default (empty demo) connection; overridden by env DATABASE_URL
sqlalchemy.url = sqlite:///./amazon_growth_os.db

# logging: emit migration progress to stderr
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
